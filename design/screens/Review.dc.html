<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speaker review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Literata:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F0A848}a:hover{color:#F7C47E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1116; color: #ECEEF1; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 6px">
    <a href="Cast.dc.html" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px; font-size: 15px; font-weight: 600; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      Cast
    </a>
    <span style="font-size: 13px; font-weight: 700; color: #9AA3AF">Chapter 1 · 3 of 37</span>
  </div>

  <div style="flex: 1; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Who says this?</h1>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: {{l.color}}">
            <span style="width: 8px; height: 8px; border-radius: 4px; background: {{l.color}}"></span>
            {{l.speaker}}
            <sc-if value="{{l.cue}}" hint-placeholder-val="{{ false }}"><span style="padding: 1px 6px; border-radius: 5px; background: #232934; color: #C9CED6; font-weight: 600">{{l.cue}}</span></sc-if>
          </div>
          <p style="margin: 0; font-family: Literata, Georgia, serif; font-size: 15px; line-height: 1.55; color: {{l.textColor}}">{{l.text}}</p>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; background: #171B22; border: 1.5px solid {{accent}}">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>
        No dialogue tag
      </div>
      <p style="margin: 0; font-family: Literata, Georgia, serif; font-size: 17px; line-height: 1.5">“You want to tell me, and I have no objection to hearing it.”</p>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
          <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.selected}}" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: #ECEEF1; font: 600 14px Manrope, sans-serif; text-align: left; cursor: pointer">
            <span style="width: 28px; height: 28px; border-radius: 14px; background: {{o.color}}; color: #10141A; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0">{{o.initials}}</span>
            <span style="flex: 1">{{o.name}}</span>
            <span style="font-size: 12px; color: #9AA3AF">{{o.conf}}</span>
          </button>
        </sc-for>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 13px; color: #C9CED6; cursor: pointer">
        <input type="checkbox" checked="{{ true }}" style="width: 20px; height: 20px; accent-color: {{accent}}">
        Use this for similar back-and-forth lines
      </label>
    </div>
  </div>

  <div style="padding: 12px 20px 28px; display: flex; gap: 10px; border-top: 1px solid #1F242D">
    <button type="button" style="min-height: 52px; padding: 0 18px; border-radius: 14px; border: 1px solid #3A414D; background: transparent; color: #ECEEF1; font: 700 15px Manrope, sans-serif">Skip</button>
    <button type="button" style="flex: 1; min-height: 52px; border-radius: 14px; border: 0; background: {{accent}}; color: #1A1205; font: 800 15px Manrope, sans-serif">Confirm · next line</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F0A848","options":["#F0A848","#7FB2F0","#9BD39A","#F4A3B5"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'mrb' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F0A848';
    const opts = [
      { id: 'mrb', name: 'Mr. Bennet', initials: 'B', conf: '71% likely', color: '#C7A6F2' },
      { id: 'mrsb', name: 'Mrs. Bennet', initials: 'MB', conf: '18%', color: '#F4A3B5' },
      { id: 'nar', name: 'Narrator', initials: 'N', conf: 'Fallback', color: '#C9CED6' }
    ];
    return {
      accent,
      lines: [
        { speaker: 'MRS. BENNET', color: '#F4A3B5', textColor: '#C9CED6', cue: '', text: '“But it is,” returned she; “for Mrs. Long has just been here, and she told me all about it.”' },
        { speaker: 'NARRATOR', color: '#C9CED6', textColor: '#C9CED6', cue: '', text: 'Mr. Bennet made no answer.' },
        { speaker: 'MRS. BENNET', color: '#F4A3B5', textColor: '#C9CED6', cue: 'impatient', text: '“Do you not want to know who has taken it?” cried his wife impatiently.' }
      ],
      options: opts.map((o) => {
        const selected = this.state.picked === o.id;
        return {
          ...o,
          selected,
          border: selected ? accent : '#2A303A',
          bg: selected ? '#232934' : 'transparent',
          pick: () => this.setState({ picked: o.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
